name: CI/CD

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  REGISTRY: ghcr.io
  # ghcr.io requires a lowercase image path.
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------
  # CI: lint, test, build, and containerize. Runs for every PR into dev
  # or main, and for every push to dev or main. Never pushes an image or
  # deploys anything.
  # ---------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    name: Tests + Coverage Artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test:ci
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_id }}
          path: coverage/
          retention-days: 14

  build:
    name: Build
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

  docker-build:
    name: Docker Build (frontend)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (validation only, not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          build-args: |
            VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
            VITE_SUPABASE_PUBLISHABLE_KEY=${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-build-backend:
    name: Docker Build (backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (validation only, not pushed)
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  # ---------------------------------------------------------------------
  # Release: only for pushes (not PRs) to dev or main, and only once CI
  # above is green. Builds the real, tagged image and pushes it to GHCR.
  # ---------------------------------------------------------------------
  release-image:
    name: Push Docker Image
    if: github.event_name == 'push'
    needs: [docker-build, docker-build-backend]
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.tags.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image tags
        id: tags
        run: |
          IMAGE="${REGISTRY}/$(echo "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"
          SHA_TAG="${IMAGE}:${GITHUB_SHA}"
          if [ "${{ github.ref_name }}" = "main" ]; then
            ENV_TAG="${IMAGE}:latest"
          else
            ENV_TAG="${IMAGE}:dev"
          fi
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${SHA_TAG}" >> "$GITHUB_OUTPUT"
          echo "env_tag=${ENV_TAG}" >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.tags.outputs.sha_tag }}
            ${{ steps.tags.outputs.env_tag }}
          build-args: |
            VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
            VITE_SUPABASE_PUBLISHABLE_KEY=${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------
  # Deploy: environment-gated, so GitHub Environment protection rules
  # (required reviewers, wait timers, etc.) are enforced by GitHub itself
  # rather than any custom approval logic here.
  #
  # No hosting target is configured in this repository yet (no cloud
  # provider workflow, no SSH/Kubernetes/PaaS config was found). The
  # steps below are placeholders — replace the "Deploy" step with the
  # real deployment command for your infrastructure. See
  # .github/CI_CD.md for what to fill in.
  # ---------------------------------------------------------------------
  deploy-development:
    name: Deploy to Development
    if: github.event_name == 'push' && github.ref_name == 'dev'
    needs: release-image
    runs-on: ubuntu-latest
    environment:
      name: development
    steps:
      - name: Deploy
        run: |
          echo "TODO: deploy ${{ needs.release-image.outputs.image }}:dev to the development environment."
          echo "No deployment target is configured yet — see .github/CI_CD.md."

  deploy-production:
    name: Deploy to Production
    if: github.event_name == 'push' && github.ref_name == 'main'
    needs: release-image
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Deploy
        run: |
          echo "TODO: deploy ${{ needs.release-image.outputs.image }}:latest to the production environment."
          echo "No deployment target is configured yet — see .github/CI_CD.md."